[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aichaind"
version = "5.0.0"
description = "AIchain local execution plane: routing, policy, provider and security daemon for OpenClaw."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Filokloi", email = "filokloi@gmail.com" }]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
aichaind = "aichaind.main:main"

[tool.setuptools.packages.find]
include = ["aichaind*", "tools*"]

[tool.pytest.ini_options]
# Only collect the real unit suite; top-level scripts (perf_test.py, burn_in.py,
# debug_sync.py, ...) are operational tools, not pytest tests.
testpaths = ["tests"]
addopts = "-q"
